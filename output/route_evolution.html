const TOTAL = SEGMENTS.length;
let step = 0, playing = false, timer = null;
let map, linesLayer, markersLayer;

// Kleurhelpers
function getColor(empColor) { return empColor; }

// Initialiseer kaart
map = L.map('map').setView([50.8893, 5.9805], 14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_matter/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 19, attribution: ''
}).addTo(map);

linesLayer = L.layerGroup().addTo(map);
markersLayer = L.layerGroup().addTo(map);

// Helper: teken alle reeds geanimeerde segmenten
function drawAllUpTo(upTo) {
  linesLayer.clearLayers();
  markersLayer.clearLayers();
  for (let i = 0; i <= upTo && i < TOTAL; i++) {
    const seg = SEGMENTS[i];
    if (seg.latlon.length >= 2) {
      const line = L.polyline(seg.latlon, { color: seg.emp_color, weight: 3, opacity: 0.9 });
      linesLayer.addLayer(line);
    }
    if (seg.client_name && !seg.is_return) {
      const lastPoint = seg.latlon[seg.latlon.length-1];
      const marker = L.circleMarker(lastPoint, {
        radius: 6, color: 'white', weight: 1.5, fillColor: seg.emp_color, fillOpacity: 0.9
      }).bindTooltip(`<b>${seg.client_name}</b><br>${seg.emp_name}<br>Stop ${seg.stop_num}`, { direction: 'top' });
      markersLayer.addLayer(marker);
    }
  }
  document.getElementById('seg-count').innerText = upTo+1;
  if (upTo >= 0) {
    const last = SEGMENTS[upTo];
    document.getElementById('info-text').innerHTML = 
      `📅 ${last.dag} &nbsp;|&nbsp; 🧑 ${last.emp_name} &nbsp;→&nbsp; ${last.client_name ? last.client_name + ' (stop '+last.stop_num+')' : 'terug naar huis'}`;
  }
}

function delay() {
  const v = +document.getElementById('speed').value;
  return Math.round(600 / (v * 0.8 + 0.2));
}

function tick() {
  if (step >= TOTAL) {
    playing = false;
    document.getElementById('play-btn').textContent = '✓ Voltooid';
    document.getElementById('play-btn').classList.remove('paused');
    if (timer) clearTimeout(timer);
    return;
  }
  drawAllUpTo(step);
  step++;
  if (playing) timer = setTimeout(tick, delay());
}

// Reset
function reset() {
  playing = false;
  if (timer) clearTimeout(timer);
  step = 0;
  drawAllUpTo(-1);
  document.getElementById('play-btn').textContent = '▶ Start';
  document.getElementById('play-btn').classList.remove('paused');
  document.getElementById('seg-count').innerText = '0';
  document.getElementById('info-text').innerHTML = 'Klaar om te starten';
}

// Event listeners
document.getElementById('play-btn').addEventListener('click', () => {
  if (step >= TOTAL) reset();
  playing = !playing;
  const btn = document.getElementById('play-btn');
  if (playing) {
    btn.textContent = '⏸ Pauze';
    btn.classList.add('paused');
    tick();
  } else {
    btn.textContent = '▶ Start';
    btn.classList.remove('paused');
    if (timer) clearTimeout(timer);
  }
});
document.getElementById('reset-btn').addEventListener('click', reset);
document.getElementById('speed').addEventListener('input', function() {
  document.getElementById('speed-val').innerText = this.value + '×';
});

// Toon initiële lege kaart
reset();
</script>
